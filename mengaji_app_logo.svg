<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="emeraldBg" cx="50%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#1B8253" />
      <stop offset="55%" stop-color="#0D5C3A" />
      <stop offset="100%" stop-color="#083D26" />
    </radialGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3E5AB" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA820A" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle App Container -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#emeraldBg)" />
  <rect width="512" height="512" rx="112" ry="112" fill="none" stroke="url(#goldGradient)" stroke-width="3" stroke-opacity="0.25" />

  <!-- Subtle Minimalist Concentric Halos -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#D4AF37" stroke-width="1.5" stroke-opacity="0.12" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08" />

  <!-- Main Minimalist Icon Emblem with Shadow -->
  <g filter="url(#subtleGlow)">
    <!-- Minimalist Crescent Base (Islamic Foundation & Audio Resonance Arc) -->
    <path
      d="M136 248 C144 320 196 360 256 360 C316 360 368 320 376 248 C356 304 308 336 256 336 C204 336 156 304 136 248 Z"
      fill="url(#goldGradient)" />

    <!-- Left Open Quran Page (Crisp Minimalist White Arc) -->
    <path
      d="M248 296 C200 280 164 240 152 196 C180 196 224 212 248 228 Z"
      fill="#FFFFFF" />

    <!-- Right Open Quran Page (Crisp Minimalist White Arc) -->
    <path
      d="M264 296 C312 280 348 240 360 196 C332 196 288 212 264 228 Z"
      fill="#FFFFFF" />

    <!-- Left Audio Recitation Resonance Wave (Gold Arc) -->
    <path
      d="M172 220 C196 224 224 240 244 260"
      fill="none"
      stroke="url(#goldGradient)"
      stroke-width="8"
      stroke-linecap="round" />

    <!-- Right Audio Recitation Resonance Wave (Gold Arc) -->
    <path
      d="M340 220 C316 224 288 240 268 260"
      fill="none"
      stroke="url(#goldGradient)"
      stroke-width="8"
      stroke-linecap="round" />

    <!-- Central Spine Division -->
    <path
      d="M256 224 L256 308"
      fill="none"
      stroke="url(#goldGradient)"
      stroke-width="9"
      stroke-linecap="round" />

    <!-- Minimalist Noor Guiding Star (Diamond Motif at Zenith) -->
    <path
      d="M256 132 L266.4 158 L292.4 168.4 L266.4 178.8 L256 204.8 L245.6 178.8 L219.6 168.4 L245.6 158 Z"
      fill="url(#goldGradient)" />

    <!-- Inner Pure Star Core Glow -->
    <path
      d="M256 152.8 L262 168.4 L256 184 L250 168.4 Z"
      fill="#FFFFFF" />
  </g>
</svg>
